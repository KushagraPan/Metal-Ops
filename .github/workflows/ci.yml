name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  supply-chain:
    name: Supply Chain & Security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository (full history for gitleaks)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check exact version pins
        run: python scripts/check_pins.py

      - name: Run npm audit (high and above)
        run: npm --prefix frontend audit --audit-level=high

      - name: Run pip-audit
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit
          pip-audit -r requirements.txt

  backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: metalops_test
          POSTGRES_PASSWORD: metalops_test
          POSTGRES_DB: metalops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_DATABASE_URL: postgresql+psycopg://metalops_test:metalops_test@127.0.0.1:5432/metalops_test
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Run database migrations
        run: make migrate

      - name: Run backend unit tests
        run: make test-unit

      - name: Run backend integration tests
        run: make test-integration

  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: cd frontend && npm ci

      - name: Run Vitest unit tests
        run: cd frontend && npm run test

      - name: Run TypeScript typecheck
        run: cd frontend && npm run typecheck

      - name: Run production build
        run: cd frontend && npm run build

  docker:
    name: Docker Build & Trivy Scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Trivy scanner
        uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1

      - name: Build backend container image
        run: docker build -t metalops-backend:ci .

      - name: Scan backend image with Trivy
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore metalops-backend:ci

      - name: Build frontend container image
        run: docker build -t metalops-frontend:ci frontend

      - name: Scan frontend image with Trivy
        run: trivy image --exit-code 1 --severity HIGH,CRITICAL --ignorefile .trivyignore metalops-frontend:ci

  ci:
    name: ci
    needs: [supply-chain, backend, frontend, docker]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check required job status
        run: |
          if [ "${{ needs.supply-chain.result }}" != "success" ] || \
             [ "${{ needs.backend.result }}" != "success" ] || \
             [ "${{ needs.frontend.result }}" != "success" ] || \
             [ "${{ needs.docker.result }}" != "success" ]; then
            echo "CI aggregate gate failed: one or more required jobs did not succeed."
            echo "supply-chain: ${{ needs.supply-chain.result }}"
            echo "backend:      ${{ needs.backend.result }}"
            echo "frontend:     ${{ needs.frontend.result }}"
            echo "docker:       ${{ needs.docker.result }}"
            exit 1
          fi
          echo "CI aggregate gate passed: all required jobs succeeded."

